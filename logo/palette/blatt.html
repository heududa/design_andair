<!doctype html><html lang="de"><meta charset="utf-8"><title>ANDAIR in der neuen Palette</title><style>
body{margin:0;font:15px/1.4 system-ui,sans-serif;width:1600px;background:#fff;color:#2A2A2A}
.sw{display:grid;grid-template-columns:repeat(3,1fr)}.sw div{padding:18px 28px;font-size:14px;letter-spacing:.08em}
.g{display:grid;grid-template-columns:repeat(3,1fr)}.g>div{height:230px;display:flex;align-items:center;justify-content:center}
h2{margin:0;padding:22px 28px 14px;font-size:16px}h2 small{font-weight:400;color:#666;margin-left:10px}
</style><body>
<div class="sw"><div style="background:#2A2A2A;color:#C0C0C0">CHARCOAL GREY · #2A2A2A</div><div style="background:#C0C0C0">MOONLIT SILVER · #C0C0C0</div><div style="background:#E10600;color:#fff">SIGNAL RED · #E10600</div></div>
<h2>Rote Dächer<small>breite Fassung</small></h2>
<div class="g"><div style="background:#C0C0C0"><img src="breit-auf-silber.svg" width="400" alt=""></div><div style="background:#2A2A2A"><img src="breit-auf-charcoal.svg" width="400" alt=""></div><div style="background:#E10600"><img src="breit-auf-rot.svg" width="400" alt=""></div></div>
<h2>Rote Dächer<small>schmale Fassung</small></h2>
<div class="g"><div style="background:#C0C0C0"><img src="schmal-auf-silber.svg" width="370" alt=""></div><div style="background:#2A2A2A"><img src="schmal-auf-charcoal.svg" width="370" alt=""></div><div style="background:#E10600"><img src="schmal-auf-rot.svg" width="370" alt=""></div></div>
<h2>Nur die Punkte rot<small>schmale Fassung</small></h2>
<div class="g"><div style="background:#C0C0C0"><img src="schmal-auf-silber-punkte.svg" width="370" alt=""></div><div style="background:#2A2A2A"><img src="schmal-auf-charcoal-punkte.svg" width="370" alt=""></div><div style="background:#fff;box-shadow:inset 0 0 0 1px #C0C0C0"><img src="schmal-auf-silber-punkte.svg" width="370" alt=""></div></div>
</body></html>
